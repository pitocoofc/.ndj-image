<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NDJ Custom Image Format - Ultra-Precision Encoder (No-Skip)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 5px; color: #38bdf8; }
        p.subtitle { color: #94a3b8; margin-top: 0; }
        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .upload-box {
            border: 2px dashed #475569;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .upload-box:hover { border-color: #38bdf8; }
        input[type="file"] { display: none; }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #0ea5e9; }
        button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        button.download-btn { background: #10b981; color: #022c22; }
        button.download-btn:hover { background: #059669; }
        canvas { max-width: 100%; height: auto; border-radius: 6px; background: #000; display: none; margin: 10px auto; }
        textarea {
            width: 100%;
            height: 160px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
        }
        .log-box {
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            color: #38bdf8;
            max-height: 130px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .stats { font-size: 14px; color: #cbd5e1; }
    </style>
</head>
<body>

    <h1>NDJ Image Format Encoder</h1>
    <p class="subtitle">Varredura Direta Pixel a Pixel | Sem Arredondamento | 2560 Chaves Dinâmicas</p>

    <div class="container">
        <label class="upload-box" id="dropZone">
            <span>Clique aqui para selecionar uma imagem</span>
            <input type="file" id="fileInput" accept="image/*">
        </label>

        <canvas id="canvas"></canvas>

        <div class="stats" id="stats">Nenhuma imagem carregada.</div>

        <div class="btn-group">
            <button id="btnProcess" disabled>Gerar Código NDJ</button>
            <button id="btnDownload" class="download-btn" disabled>Baixar Arquivo .ndj</button>
        </div>

        <div>
            <label>Status do Mapeamento:</label>
            <div class="log-box" id="logBox">Aguardando processamento...</div>
        </div>

        <div>
            <label for="outputCode">Código Gerado:</label>
            <textarea id="outputCode" readonly placeholder="O código das chaves exatas aparecerá aqui..."></textarea>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnProcess = document.getElementById('btnProcess');
        const btnDownload = document.getElementById('btnDownload');
        const outputCode = document.getElementById('outputCode');
        const logBox = document.getElementById('logBox');
        const stats = document.getElementById('stats');

        let loadedImage = null;
        let generatedScript = null;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadImage(file);
        });

        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    canvas.style.display = 'block';

                    loadedImage = { width: img.width, height: img.height };
                    stats.innerText = `Imagem: ${img.width}x${img.height} pixels (${img.width * img.height} pixels totais)`;
                    btnProcess.disabled = false;
                    btnDownload.disabled = true;
                    outputCode.value = '';
                    logBox.innerText = 'Imagem pronta para varredura sem pulos.';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        btnProcess.addEventListener('click', () => {
            if (!loadedImage) return;

            logBox.innerText = "Executando leitura direta e abrindo paleta pura sem bitwise...\n";
            
            setTimeout(() => {
                const width = loadedImage.width;
                const height = loadedImage.height;
                const imgData = ctx.getImageData(0, 0, width, height);
                const data = imgData.data;

                // 1. Extrai paleta com tons RGB puros (8 bits completos por canal, 0-255)
                const palette = extractPurePalette(data, 2560);
                logBox.innerText += `> Cores únicas mapeadas na paleta: ${palette.length}\n`;

                // 2. Associa cada pixel exatamente à sua cor mais próxima ou idêntica
                const colorSets = new Array(palette.length).fill(null).map(() => []);
                const totalPixels = width * height;

                for (let i = 0; i < totalPixels; i++) {
                    const idx = i * 4;
                    const r = data[idx];
                    const g = data[idx+1];
                    const b = data[idx+2];

                    const paletteIdx = findClosestPaletteIndex(r, g, b, palette);
                    colorSets[paletteIdx].push(i + 1);
                }

                // 3. Monta o script NDJ
                let script = `# NDJ Custom Image Format - Precision Map\n`;
                script += `CANVAS ${width} ${height}\n`;
                script += `PALETTE_SIZE ${palette.length}\n\n`;

                let activeKeys = 0;
                for (let i = 0; i < palette.length; i++) {
                    if (colorSets[i].length === 0) continue;

                    const hexColor = rgbToHex(palette[i].r, palette[i].g, palette[i].b);
                    const compressedRanges = compressToRanges(colorSets[i]);
                    script += `@c${activeKeys} (${hexColor}): {${compressedRanges.join(', ')}}\n`;
                    activeKeys++;
                }

                logBox.innerText += `> Chaves geradas no arquivo: ${activeKeys}\n`;
                logBox.innerText += `> Suavidade maximizada sem faixas ou escadas de cor!`;

                generatedScript = script;
                outputCode.value = script;
                stats.innerText = `Concluído! ${activeKeys} chaves ativas para ${totalPixels} pixels.`;
                btnDownload.disabled = false;

            }, 50);
        });

        btnDownload.addEventListener('click', () => {
            if (!generatedScript) return;
            const blob = new Blob([generatedScript], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'imagem_precisa.ndj';
            a.click();
            URL.revokeObjectURL(url);
        });

        // --- EXTRAÇÃO PURA SEM MÁSCARA & 0xF8 ---
        function extractPurePalette(data, maxColors) {
            const colorHistogram = new Map();
            const total = data.length;

            // LER 100% DOS PIXELS (Pixel a Pixel, Sem Pulos)
            for (let i = 0; i < total; i += 4) {
                const r = data[i];     // Sem & 0xF8
                const g = data[i+1];   // Sem & 0xF8
                const b = data[i+2];   // Sem & 0xF8
                const key = (r << 16) | (g << 8) | b;

                colorHistogram.set(key, (colorHistogram.get(key) || 0) + 1);
            }

            // Ordena pelas cores mais frequentes da foto
            const sorted = Array.from(colorHistogram.entries()).sort((a, b) => b[1] - a[1]);
            const sliced = sorted.slice(0, maxColors);

            return sliced.map(([key]) => ({
                r: (key >> 16) & 0xFF,
                g: (key >> 8) & 0xFF,
                b: key & 0xFF
            }));
        }

        function findClosestPaletteIndex(r, g, b, palette) {
            let minDistance = Infinity;
            let closest = 0;

            for (let i = 0; i < palette.length; i++) {
                const dr = r - palette[i].r;
                const dg = g - palette[i].g;
                const db = b - palette[i].b;
                const dist = dr*dr + dg*dg + db*db;

                if (dist < minDistance) {
                    minDistance = dist;
                    closest = i;
                    if (dist === 0) break; // Encontrou a cor idêntica em 100%
                }
            }
            return closest;
        }

        function rgbToHex(r, g, b) {
            return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1).toUpperCase()}`;
        }

        function compressToRanges(arr) {
            const ranges = [];
            if (arr.length === 0) return ranges;

            let start = arr[0];
            let end = start;

            for (let i = 1; i < arr.length; i++) {
                if (arr[i] === end + 1) {
                    end = arr[i];
                } else {
                    ranges.push(start === end ? `${start}` : `${start}..${end}`);
                    start = arr[i];
                    end = start;
                }
            }
            ranges.push(start === end ? `${start}` : `${start}..${end}`);
            return ranges;
        }
    </script>
</body>
</html>
